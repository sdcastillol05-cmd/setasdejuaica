<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog de Setas de Juaica | En construcción</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500;700&family=Inter:wght@400;500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">

<main>
  <section class="hero bg-menta">
    <div class="wrap">
      <h1 class="tagline" style="font-size:clamp(56px,13vw,170px)" aria-label="Blog en construcción">

        <span class="l">construcción</span>

        <p class="hero-copy">Estamos cocinando recetas y curiosidades sobre las setas. Vuelve pronto, que ya casi está.</p>

      </div>
    </div>
  </section>
</main>
<footer class="foot bg-vino" style="margin-top:0;border-radius:0">
  <div class="wrap foot-in">
    <img class="logo logo-foot" src="setaslog.svg" alt="Setas de Juaica">
    <a class="foot-mail" href="mailto:setasjuaica@gmail.com">setasjuaica@gmail.com</a>
