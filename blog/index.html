<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog de Setas de Juaica | En construcción</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logosetas.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@500;700&family=Inter:wght@400;500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="Setas de Juaica, inicio"><img class="logo" src="/logosetas.svg" alt=""><span>Setas de Juaica</span></a>
  <a class="btn btn-sm" href="/">Volver a la tienda</a>
</header>
<main>
  <section class="blog-stage">
    <div class="wrap stage">
      <img class="stage-leon" data-leon src="/leonconstruccion.svg" alt="La mascota de Setas de Juaica con el blog en construcción">
      <h1>Blog en construcción</h1>
      <p>Estamos cocinando recetas y curiosidades sobre las setas. Vuelve pronto, que ya casi está.</p>
      <a class="btn" href="/">Ver las setas</a>
    </div>
  </section>
</main>
<footer class="foot bg-vino">
  <div class="wrap foot-in">
    <div class="foot-brand">
      <img class="logo logo-foot" src="/setaslog.svg" alt="Setas de Juaica">
      <span>Frescas y sin conservantes desde 2017</span>
    </div>
    <address class="foot-contact">
      <a class="foot-mail" href="mailto:hola@setasdejuaica.com">hola@setasdejuaica.com</a>
      <a class="foot-mail" href="mailto:setasjuaica@gmail.com">setasjuaica@gmail.com</a>
      <span>Km 1 vía Tabio-Tenjo, finca Santa Ana</span>
    </address>
    <span>© <span id="year">2026</span></span>
  </div>
</footer>
<script src="/main.js"></script>
</body>
</html>
